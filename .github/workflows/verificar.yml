# Verificação automática da VentiCondutas em cada pull request e em cada push para main (~10 min).
# Corre no GitHub (Linux, Chromium sem janela). Falha se:
#   · o lint encontrar um erro
#   · um teste interno falhar, houver erros JS, um relatório ou exportação falhar (verificar)
#   · o resultado da app mudar face a tests/fotografia-referencia.json (regressao)
#   · um cenário da planta feito com rato e teclado falhar (cenarios)
# As mutações (verificar se os testes apanham erros de propósito) correm à parte, uma vez por
# semana e a pedido: ver mutacoes.yml.
# Quando uma mudança de resultado é intencional: npm run referencia e fazer commit da nova fotografia.
name: Verificar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npx eslint .
      - name: Verificação (testes, relatórios, exportações, percurso pelos ecrãs)
        run: npm run verificar
      - name: Regressão (fotografia de referência)
        run: npm run regressao
      - name: Cenários da planta (rato e teclado reais)
        run: npm run cenarios
